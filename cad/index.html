<style>
/* Layout: one-screen field tool — header / layer tabs / full-bleed drawing / thumb toolbar. Tape-measure amber on blueprint-steel neutrals. */
:root{
  --bg:#E9EDF0; --panel:#FFFFFF; --panel2:#F3F6F8; --ink:#17212A; --muted:#5A6774; --line:#D2DAE0;
  --paper:#FCFDFD; --accent:#B86400; --accent-soft:#F7E6CF; --accent-ink:#FFFFFF;
  --danger:#C2372B; --danger-soft:#F8DEDA; --snap:#0A74B8; --dimmed:#B8C2CA;
  --font-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow",var(--font-ui);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --panel:#192027; --panel2:#202932; --ink:#E5EBF0; --muted:#8F9DAA; --line:#2B353F;
  --paper:#0C1014; --accent:#F0A43C; --accent-soft:#3A2A14; --accent-ink:#1B1206;
  --danger:#FF6E61; --danger-soft:#3D1D1A; --snap:#52B9FF; --dimmed:#3A4550; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --panel:#192027; --panel2:#202932; --ink:#E5EBF0; --muted:#8F9DAA; --line:#2B353F;
  --paper:#0C1014; --accent:#F0A43C; --accent-soft:#3A2A14; --accent-ink:#1B1206;
  --danger:#FF6E61; --danger-soft:#3D1D1A; --snap:#52B9FF; --dimmed:#3A4550; color-scheme:dark}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}

/* header */
.top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.ttl b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--panel2)}
.ib:disabled{opacity:.3}
.ib svg{width:22px;height:22px}
.save{height:36px;padding:0 14px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;flex:none}

/* tabs */
.tabrow{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line)}
.tabrow .listbtn{flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;font-size:12px;font-weight:600;border-right:1px solid var(--line);color:var(--muted)}
.tabrow .listbtn svg{width:18px;height:18px}
.tabs{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:10px 12px 8px;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--muted);max-width:220px}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .ct{font-family:var(--font-num);font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.tab .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab.off .nm{text-decoration:line-through;opacity:.6}
.tab.trash{color:var(--danger)}
.tab.zero{opacity:.4}
.tab .gb{width:10px;height:10px;border-radius:3px;flex:none}
.subtabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--panel2);border-bottom:1px solid var(--line);padding:0 4px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .tab{padding:8px 10px 6px;font-size:12px}
.ghead{display:flex;align-items:center;gap:8px;padding:10px 0 4px;border-bottom:2px solid var(--line)}
.ghead .gb{width:12px;height:12px;border-radius:3px;flex:none}
.ghead b{flex:1;font-size:14px}
.ghead .ct{font-size:12px;color:var(--muted);font-weight:500}
.gsel{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12px;padding:0 4px;flex:none;max-width:84px}

/* stage */
.stage{position:relative;flex:1;min-height:0;background:var(--paper);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.pill{position:absolute;left:50%;transform:translateX(-50%);top:52px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12);pointer-events:none;white-space:nowrap}
.pill b{font-family:var(--font-num);font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent)}
.hint{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:center;pointer-events:none}
.hint > div{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.hint button{background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
#loupe{position:absolute;top:56px;left:10px;width:120px;height:120px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.25);background:var(--paper);pointer-events:none}
.float{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:8px;min-width:0}
.frow .grow{flex:1;min-width:0}
.lname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsub{font-size:11px;color:var(--muted)}
.btn{height:40px;padding:0 12px;border-radius:9px;background:var(--panel2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;white-space:nowrap}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.del{background:var(--danger-soft);color:var(--danger)}
.btn.sel{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn svg{width:18px;height:18px}
.big{font-family:var(--font-num);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.big small{font-size:15px;color:var(--muted);margin-left:2px;font-weight:600}
.divs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.divs::-webkit-scrollbar{display:none}
.segline{font-family:var(--font-num);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto}

/* toolbar */
.tool{display:flex;align-items:stretch;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;border-radius:10px;font-size:10.5px;color:var(--muted)}
.tb svg{width:24px;height:24px}
.tb.on{color:var(--accent);background:var(--accent-soft)}
.tb.mode.on{color:var(--accent-ink);background:var(--accent)}
.sep{width:1px;background:var(--line);margin:8px 3px;flex:none}

/* sheets */
.back{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:16px 16px 0 0;max-height:82%;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h2{flex:1;margin:0;font-size:16px}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sh-tools{display:flex;gap:6px;flex-wrap:wrap}
.grp{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding-top:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--muted)}
.row .num{font-family:var(--font-num);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:0 0 0 1px var(--line)}
.eye{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);flex:none}
.eye.off{opacity:.45}
.eye svg{width:20px;height:20px}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;font-size:16px;color:var(--ink);-webkit-user-select:text;user-select:text}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.bigbtn{height:52px;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn.pri{background:var(--accent);color:var(--accent-ink)}
.bigbtn.sec{background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:999px;font-size:13px;z-index:40;max-width:90%;text-align:center;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);font-size:14px;color:var(--muted);z-index:5}
.confirm{display:flex;gap:6px;align-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style>

<div id="app">
  <div class="top">
    <button class="ib" id="bOpen" aria-label="ファイルを開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <div class="ttl"><b id="fname">—</b><span id="fsub"></span></div>
    <button class="ib" id="bUndo" aria-label="元に戻す" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="bRedo" aria-label="やり直し" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="save" id="bSave">保存</button>
  </div>
  <div class="tabrow">
    <button class="listbtn" id="bLayers" aria-label="レイヤー一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>一覧</button>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="subtabs" id="subtabs" hidden></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <canvas id="ov"></canvas>
    <canvas id="loupe" hidden></canvas>
    <div class="pill" id="pill" hidden></div>

    <div class="float" id="layerBar" hidden></div>

  </div>
  <div class="tool">
    <button class="tb mode" id="mPan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>移動・選択</button>
    <button class="tb mode" id="mDim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v8M21 8v8M3 12h18"/><path d="m6 9-3 3 3 3M18 9l3 3-3 3"/></svg>寸法</button>
    <div class="sep"></div>
    <button class="tb" id="tOrtho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 4v15h15"/><path d="M5 12h6v7" stroke-dasharray="2 2"/></svg>縦横</button>
    <button class="tb" id="tChain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 12h20M2 9v6M9 9v6M15 9v6M22 9v6"/></svg>連続</button>
    <button class="tb" id="tSnap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="8"/><path d="M3 12h5M16 12h5M12 3v5M12 16v5"/></svg>吸着</button>
    <div class="sep"></div>
    <button class="tb" id="bFit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全体</button>
    <button class="tb" id="bDims"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h1M3 12h1M3 18h1"/></svg>寸法一覧</button>
  </div>
</div>
<input type="file" id="fileIn" hidden>
<div id="sheetRoot"></div>

<script>
"use strict";
/* ============ constants & state ============ */
const DIM_LAYER = '追加寸法';
const META = 'WADA_ZUMEN:';
const SAMPLE_NAME = '受け取った図面_261016.dxf';
const MAGE_BASE = 'https://akija114.github.io/Reibai-Magememo/';
const ON_MAGE_SITE = location.hostname === 'akija114.github.io';
const HAS_SAMPLE = !(document.getElementById('sample').textContent || '').trim().startsWith('__');
const GROUPS = [
  {id:'ac',   name:'空調',   col:'#2F8FD8', re:/冷媒|ドレン|空調|空気調和|機器|エアコン|室外機|室内機|冷温水|冷却水|冷水|温水|HVAC|メンテナンス|スリーブ|^M[-_ ]/i},
  {id:'duct', name:'ダクト', col:'#8B5CF6', re:/ダクト|DUCT|制気口|吹出|吸込|ガラリ|チャンバ/i},
  {id:'san',  name:'衛生',   col:'#14A38B', re:/給水|給湯|排水|汚水|雑排|通気|衛生|消火|スプリンクラ|ガス|上水|中水|雨水|散水|器具|^P[-_ ]/i},
  {id:'elec', name:'電気',   col:'#D49B00', re:/電気|電灯|電源|コンセント|照明|弱電|強電|動力|幹線|ケーブル|配線|分電|盤|^E[-_ ]/i},
  {id:'arch', name:'建築',   col:'#9A7B5F', re:/躯体|梁|柱|壁|スラブ|基礎|杭|建具|室名|天井|床|通り?芯|平面詳細|既設|隣家|方位|鉄骨|間仕切|RC|階段|窓|扉|建築|^A[-_ ]/i},
  {id:'etc',  name:'その他', col:'#8893A0', re:null},
];
const GROUP_ORDER = ['duct','ac','san','elec','arch']; // match order: duct first so 空調ダクト goes to ダクト
const gById = id => GROUPS.find(g => g.id === id) || GROUPS[GROUPS.length-1];
function autoGroup(name){ const n = name.normalize('NFKC'); for (const id of GROUP_ORDER){ if (gById(id).re.test(n)) return id; } return 'etc'; }
function loadGroupPrefs(){ try { return JSON.parse(localStorage.getItem('zumen-groups') || '{}') || {}; } catch(e){ return {}; } }
function saveGroupPref(name, gid){ try { const m = loadGroupPrefs(); if (gid === autoGroup(name)) delete m[name]; else m[name] = gid; localStorage.setItem('zumen-groups', JSON.stringify(m)); } catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const S = {
  text:'', eol:'\r\n', srcName:'', name:'', fileId:'', projectId:null,
  units:'mm', geo:null, layers:[], dims:[], selDim:null,
  mode:'pan', ortho:true, chain:false, snapOn:true, tab:null, group:null,
  undo:[], redo:[], textH:150,
};
let view = {s:1, tx:0, ty:0}, bview = {s:1, tx:0, ty:0};
let cw = 0, ch = 0, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
const cv = $('#cv'), ov = $('#ov'), lp = $('#loupe');
const ctx = cv.getContext('2d'), octx = ov.getContext('2d'), lctx = lp.getContext('2d');
const base = document.createElement('canvas'), bctx = base.getContext('2d');
let tok = {};

/* ============ colours ============ */
function readTokens(){
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  tok = {paper:g('--paper'), ink:g('--ink'), accent:g('--accent'), snap:g('--snap'), dimmed:g('--dimmed'), panel:g('--panel'), muted:g('--muted'), danger:g('--danger')};
  const p = tok.paper.replace('#','');
  tok.dark = p.length >= 6 && (parseInt(p.slice(0,2),16) + parseInt(p.slice(2,4),16) + parseInt(p.slice(4,6),16)) < 300;
  colorCache.clear();
}
const colorCache = new Map();
function hsv(h, s, v){ const f = n => { const k = (n + h/60) % 6; return v - v*s*Math.max(Math.min(k, 4-k, 1), 0); }; return [f(5)*255, f(3)*255, f(1)*255]; }
function aciRGB(n){
  const b = {1:[255,0,0],2:[255,255,0],3:[0,255,0],4:[0,255,255],5:[0,0,255],6:[255,0,255],8:[128,128,128],9:[192,192,192]};
  if (b[n]) return b[n];
  if (n >= 250 && n <= 255){ const g = [51,91,132,173,214,255][n-250]; return [g,g,g]; }
  if (n >= 10 && n <= 249){ const h = Math.floor((n-10)/10)*15, k = (n-10)%10; const v = [1,1,.8,.8,.65,.65,.5,.5,.3,.3][k]; return hsv(h, k%2 ? .5 : 1, v); }
  return null;
}
function colorCss(key){
  let c = colorCache.get(key); if (c) return c;
  let rgb = null;
  if (key[0] === '#') { const v = parseInt(key.slice(1),16); rgb = [(v>>16)&255,(v>>8)&255,v&255]; }
  else rgb = aciRGB(+key.slice(1));
  if (!rgb) c = tok.ink;
  else {
    let [r,g,b] = rgb; const lum = (0.299*r + 0.587*g + 0.114*b)/255;
    if (!tok.dark && lum > 0.62){ const f = 0.62/lum*0.85; r*=f; g*=f; b*=f; }

/* ============ commands (undo/redo) ============ */

function undo(){ const c = S.undo.pop(); if (!c) return; c.undo(); S.redo.push(c); changed(c.kind); toast('元に戻しました：' + c.label); }

function changed(kind){

  drawOverlay(); updateUi(); refreshOpenSheet(); autosave();
}
function cmdDelLayers(names, label){

}
function cmdRestoreLayers(names){

}
function cmdVis(names, on){
  const ls = names.map(n => G.L.find(l => l.name === n)).filter(l => l && l.on !== on);

/* ============ storage (IndexedDB, this device only) ============ */
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try { const r = indexedDB.open('zumen-sunpo', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('files', {keyPath:'id'}); d.createObjectStore('projects', {keyPath:'id'}); };
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch(e){ res(null); }
  });
  return dbp;
}
async function dbOp(store, mode, fn){
  const d = await idb(); if (!d) return null;
  return new Promise(res => { try { const tx = d.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st); tx.oncomplete = () => res(r && 'result' in r ? r.result : true); tx.onerror = () => res(null); tx.onabort = () => res(null); } catch(e){ res(null); } });
}
const dbGet = (s, k) => dbOp(s, 'readonly', st => st.get(k));
const dbPut = (s, v) => dbOp(s, 'readwrite', st => st.put(v));
const dbDel = (s, k) => dbOp(s, 'readwrite', st => st.delete(k));
const dbAll = s => dbOp(s, 'readonly', st => st.getAll());
function stateRecord(){ const groups = {}; G.L.forEach(l => { if (l.g !== autoGroup(l.name)) groups[l.name] = l.g; }); return {groups, deleted:G.L.filter(l => l.deleted).map(l => l.name), hidden:G.L.filter(l => !l.on).map(l => l.name), dims:S.dims.map(({x1,y1,x2,y2,n}) => ({x1,y1,x2,y2,n:n||1}))}; }
let autoT = 0;
function autosave(){
  clearTimeout(autoT);
  autoT = setTimeout(() => { if (!G) return; dbPut('projects', {id:'__last', name:S.name, srcName:S.srcName, fileId:S.fileId, projectId:S.projectId, updated:Date.now(), ...stateRecord()}); }, 800);
}
function hashText(t){ let h = 2166136261; const step = Math.max(1, Math.floor(t.length/20000)); for (let i = 0; i < t.length; i += step){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + t.length.toString(36); }

/* ============ open ============ */
async function openText(text, srcName, opts = {}){
  $('#loading').hidden = false; $('#loading').textContent = '図面を読み込み中…';
  await new Promise(r => setTimeout(r, 30));
  try {
    const doc = parseDxf(text);
    const flat = flatten(doc);
    if (!flat.segs.length && !flat.texts.length) throw new Error('図形が見つかりません');
    S.text = text; S.eol = text.includes('\r\n') ? '\r\n' : '\n'; S.srcName = srcName;
    S.fileId = opts.fileId || hashText(text);
    const u = parseInt(doc.header.$INSUNITS?.[70]); S.units = ({1:'in',2:'ft',4:'mm',5:'cm',6:'m'})[u] || 'mm';
    G = prepare(flat);
    const st = opts.state || (doc.meta ? {deleted:[], hidden:doc.meta.hidden || [], dims:doc.meta.dims || [], groups:doc.meta.groups || {}} : null);
    S.dims = []; S.undo = []; S.redo = []; S.selDim = null; S.tab = null; S.group = null; MS.p1 = null; MS.cur = null;
    { const pref = loadGroupPrefs(); G.L.forEach(l => { if (pref[l.name] && GROUPS.some(g => g.id === pref[l.name])) l.g = pref[l.name]; }); }
    if (st){
      const del = new Set(st.deleted || []), hid = new Set(st.hidden || []);
      G.L.forEach(l => { if (del.has(l.name)) l.deleted = true; if (hid.has(l.name)) l.on = false; const gg = st.groups && st.groups[l.name]; if (gg && GROUPS.some(g => g.id === gg)) l.g = gg; });
      S.dims = (st.dims || []).map((d, i) => ({id:'d' + i + Date.now().toString(36), x1:+d.x1, y1:+d.y1, x2:+d.x2, y2:+d.y2, n:+d.n || 1}));
    }
    S.name = opts.name || (doc.meta?.name) || srcName.replace(/\.dxf$/i, '');
    S.projectId = opts.projectId || null;
    buildIndex(); view = {s:1, tx:0, ty:0}; fit(); renderTabs(); updateUi();
    if (opts.fileId !== 'sample' && !opts.noStore) dbOp('files', 'readwrite', s => s.put({id:S.fileId, text, srcName}));
    autosave();
    $('#loading').hidden = true;
    return true;
  } catch(err){
    $('#loading').hidden = !!G; $('#loading').textContent = '開けませんでした';
    toast('開けませんでした：' + (err.message || 'DXFファイルか確認してください'));
    return false;
  }
}
async function readUpload(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] === 0x50 && buf[1] === 0x4B){ const r = await unzipDxf(buf); if (!r) throw new Error('ZIPの中にDXFがありません'); return r; }
  if (/^AutoCAD Binary DXF/.test(String.fromCharCode(...buf.slice(0, 18)))) throw new Error('バイナリDXFは未対応です（テキスト形式で保存してください）');
  if (buf[0] === 0x41 && buf[1] === 0x43 && buf[2] === 0x31) throw new Error('DWGは開けません。CADでDXFに書き出してください');
  return {text:decodeBytes(buf), name:file.name};
}
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  closeSheet();

async function loadSample(){
  const b64 = (document.getElementById('sample').textContent || '').trim();
  if (!b64 || b64.startsWith('__') || !('DecompressionStream' in window)) return null;
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return decodeBytes(new Uint8Array(await new Response(ds).arrayBuffer()));
}

function buildExport(name){
  const {codes, vals, n} = toPairs(S.text);
  const del = new Set(G.L.filter(l => l.deleted).map(l => l.name)); del.add(DIM_LAYER);
  // pre-scan
  let seed = 0, layerTbl = null, msHandle = null, plotStyle = null, inTable = null, dimLayerExists = false;
  for (let i = 0; i < n; i++){
    if (codes[i] === 9 && vals[i].trim() === '$HANDSEED') seed = parseInt(vals[i+1], 16);
    if (codes[i] === 0 && vals[i].trim() === 'TABLE'){ inTable = (vals[i+1] || '').trim(); if (inTable === 'LAYER'){ for (let j = i+1; j < i+10 && j < n; j++) if (codes[j] === 5){ layerTbl = vals[j].trim(); break; } } }
    if (codes[i] === 0 && vals[i].trim() === 'BLOCK_RECORD'){ let h = null, nm = null; for (let j = i+1; j < n && codes[j] !== 0; j++){ if (codes[j] === 5) h = vals[j].trim(); if (codes[j] === 2) nm = vals[j].trim(); } if (nm && nm.toUpperCase() === '*MODEL_SPACE') msHandle = h; }
    if (codes[i] === 0 && vals[i].trim() === 'LAYER' && inTable === 'LAYER'){ let nm = null, ps = null; for (let j = i+1; j < n && codes[j] !== 0; j++){ if (codes[j] === 2) nm = vals[j].trim(); if (codes[j] === 390) ps = vals[j].trim(); } if (nm === '0') plotStyle = ps; if (nm === DIM_LAYER) dimLayerExists = true; }
  }
  const modern = !!msHandle; let next = seed || 0x10000;
  const H = () => (next++).toString(16).toUpperCase();
  const P = (c, v) => [String(c).padStart(3, ' '), String(v)];
  const num = v => (Math.round(v*1e6)/1e6).toString();
  function ent(type, sub, body){
    let a = P(0, type);
    if (modern) a = a.concat(P(5, H()), P(330, msHandle), P(100, 'AcDbEntity'));
    a = a.concat(P(8, DIM_LAYER));
    if (modern) a = a.concat(P(100, sub));
    return a.concat(body);
  }
  const line = (x1, y1, x2, y2) => ent('LINE', 'AcDbLine', [...P(10,num(x1)), ...P(20,num(y1)), ...P(30,'0.0'), ...P(11,num(x2)), ...P(21,num(y2)), ...P(31,'0.0')]);
  const text = (x, y, h, angDeg, s, va) => { // centered, va: 1 bottom / 3 top
    let a = ent('TEXT', 'AcDbText', [...P(10,num(x)), ...P(20,num(y)), ...P(30,'0.0'), ...P(40,num(h)), ...P(1,s), ...P(50,num(angDeg)), ...P(72,1), ...P(11,num(x)), ...P(21,num(y)), ...P(31,'0.0')]);
    if (modern) a = a.concat(P(100, 'AcDbText')); return a.concat(P(73, va));
  };
  const th = S.textH, newEnts = [];
  for (const d of S.dims){
    const L = Math.hypot(d.x2-d.x1, d.y2-d.y1); if (L <= 0) continue; const nn = d.n || 1;
    const ux = (d.x2-d.x1)/L, uy = (d.y2-d.y1)/L;
    const ra = readableAngle(ux, uy), nx = -Math.sin(ra), ny = Math.cos(ra), deg = ra*180/Math.PI;
    newEnts.push(line(d.x1, d.y1, d.x2, d.y2));
    const tk = th*0.5;
    for (let i = 0; i <= nn; i++){ const px = d.x1 + (d.x2-d.x1)*i/nn, py = d.y1 + (d.y2-d.y1)*i/nn; newEnts.push(line(px - (ux+nx)*tk, py - (uy+ny)*tk, px + (ux+nx)*tk, py + (uy+ny)*tk)); }
    if (nn === 1) newEnts.push(text((d.x1+d.x2)/2 + nx*th*.4, (d.y1+d.y2)/2 + ny*th*.4, th, deg, fmt(L), 1));
    else {
      for (let i = 0; i < nn; i++){ const px = d.x1 + (d.x2-d.x1)*(i+.5)/nn, py = d.y1 + (d.y2-d.y1)*(i+.5)/nn; newEnts.push(text(px + nx*th*.4, py + ny*th*.4, th, deg, fmt(L/nn), 1)); }
      newEnts.push(text((d.x1+d.x2)/2 - nx*th*.4, (d.y1+d.y2)/2 - ny*th*.4, th, deg, '計' + fmt(L), 3));
    }
  }
  let layerRec = [];
  if (!dimLayerExists){
    layerRec = P(0, 'LAYER');
    if (modern) layerRec = layerRec.concat(P(5, H()), P(330, layerTbl || '0'), P(100, 'AcDbSymbolTableRecord'), P(100, 'AcDbLayerTableRecord'));
    layerRec = layerRec.concat(P(2, DIM_LAYER), P(70, 0), P(62, 1), P(6, 'Continuous'));
    if (modern){ layerRec = layerRec.concat(P(370, -3)); if (plotStyle) layerRec = layerRec.concat(P(390, plotStyle)); }
  }
  const meta = {v:1, name, dims:stateRecord().dims, groups:stateRecord().groups, hidden:G.L.filter(l => !l.on && !l.deleted).map(l => l.name)};
  const out = [...P(999, META + JSON.stringify(meta))];
  let section = null, table = null, dropSeq = false;
  let i = 0;
  while (i < n){
    const c = codes[i], v = vals[i];
    if (c === 999 && v.startsWith(META)){ i++; continue; }
    if (c === 0){
      const t = v.trim();
      if (t === 'SECTION'){ section = (vals[i+1] || '').trim(); }
      if (t === 'TABLE') table = (vals[i+1] || '').trim();
      if (t === 'ENDTAB' && table === 'LAYER' && layerRec.length){ out.push(...layerRec); layerRec = []; }
      if (t === 'ENDSEC' && section === 'ENTITIES'){ for (const e of newEnts) out.push(...e); }
      if ((section === 'ENTITIES' || section === 'BLOCKS') && t !== 'SECTION' && t !== 'ENDSEC' && t !== 'BLOCK' && t !== 'ENDBLK'){
        let j = i + 1, layer = null, attFollow = false;
        while (j < n && codes[j] !== 0){ if (codes[j] === 8 && layer === null) layer = vals[j].trim(); if (codes[j] === 66 && parseInt(vals[j]) === 1) attFollow = true; j++; }
        let drop = false;
        if (dropSeq && (t === 'VERTEX' || t === 'ATTRIB' || t === 'SEQEND')){ drop = true; if (t === 'SEQEND') dropSeq = false; }
        else { dropSeq = false; if (layer !== null && del.has(layer)){ drop = true; if (t === 'POLYLINE' || (t === 'INSERT' && attFollow)) dropSeq = true; } }
        if (!drop) for (let k = i; k < j; k++) out.push(String(codes[k]).padStart(3, ' '), vals[k]);
        i = j; continue;
      }
    }
    if (c === 9 && v.trim() === '$HANDSEED'){ out.push(String(c).padStart(3,' '), v); i++; continue; }
    if (c === 5 && i > 0 && codes[i-1] === 9 && vals[i-1].trim() === '$HANDSEED'){ out.push(String(c).padStart(3,' '), (next).toString(16).toUpperCase()); i++; continue; }
    out.push(String(c).padStart(3, ' '), v); i++;
  }
  // fix handseed (header pair code 5 follows $HANDSEED)
  for (let k = 0; k < out.length - 2; k += 2){ if (out[k+1].trim() === '$HANDSEED'){ out[k+3] = next.toString(16).toUpperCase(); break; } }

async function unzipDxf(u8){
