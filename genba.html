<!DOCTYPE html>
<html lang="ja" data-app="genba">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場 - 冷媒配管の曲げ共有</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0369a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="曲げ共有 v1.00">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#0f172a;--sub:#5b6b7e;--line:#c9d5e0;--acc:#0369a1;--panel:#e2e8f0;--danger:#dc2626;--line2:#06c755}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#16222f;--ink:#e8eef5;--sub:#93a5b8;--line:#2b3b4c;--acc:#38bdf8;--panel:#1e2b3a;--danger:#f87171}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#16222f;--ink:#e8eef5;--sub:#93a5b8;--line:#2b3b4c;--acc:#38bdf8;--panel:#1e2b3a;--danger:#f87171}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 90px)}
.apps{display:flex;gap:4px;margin:0 0 10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.apps a{flex:1;text-align:center;padding:7px 0;border-radius:9px;font-size:13px;font-weight:800;color:var(--sub);text-decoration:none;white-space:nowrap}
.apps a.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
h1{font-size:19px;margin:4px 2px 0;display:flex;align-items:center;gap:8px}h1 .grow{flex:1}
h2{font-size:15px;margin:0 0 8px}
.note{font-size:12.5px;color:var(--sub);line-height:1.55;margin-top:6px}
label.f{display:block;font-size:12.5px;font-weight:800;color:var(--sub);margin:10px 0 4px}label.f:first-of-type{margin-top:0}
input,textarea,select{width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:9px 10px}
input{height:44px}textarea{min-height:84px;line-height:1.5;resize:vertical}
.row{display:flex;gap:8px;align-items:center}.row > *{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;box-sizing:border-box;min-height:44px;text-align:left}input::-webkit-date-and-time-value{text-align:left}   /* iPhoneの日付・時刻の欄が横にはみ出して重なるのを止める */
.btn{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:14px;padding:0 12px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.line{background:var(--line2);border-color:var(--line2);color:#fff}.btn.del{color:var(--danger)}
.btn.sm{height:34px;font-size:13px;padding:0 10px}.btn:disabled{opacity:.45}
.grow{flex:1}
.site{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;color:var(--ink);font:inherit}
.site b{font-size:17px}.site .sub{color:var(--sub);font-size:13px;margin-top:3px}
.empty{color:var(--sub);text-align:center;padding:28px 8px;font-size:14px;line-height:1.7}
.mem{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}.mem:first-child{border-top:0}
.mem .nm{flex:1;font-size:16px;font-weight:700}
.star{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px;filter:grayscale(1);opacity:.4}.star.on{filter:none;opacity:1;border-color:#f5b301}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13.5px;font-weight:700}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.ph{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph button{position:absolute;right:3px;top:3px;width:28px;height:28px;border-radius:14px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px}
pre.out{white-space:pre-wrap;word-break:break-all;font:inherit;font-size:14px;line-height:1.6;margin:0;background:var(--bg);border-radius:10px;padding:10px;max-height:46vh;overflow:auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;z-index:5}.bar .btn{flex:1;height:48px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;z-index:9;line-height:1.5}
a.map{color:var(--acc);font-weight:700;font-size:13.5px;word-break:break-all}
.need{font-size:13.5px;font-weight:800;margin-top:4px}.need.ng{color:var(--danger)}.need.mid{color:#b45309}.need.ok{color:#15803d}
.mem small.dd{font-size:12px;color:var(--sub);font-weight:600}
.wtab{overflow-x:auto;margin:0 -4px}.wtab table{border-collapse:separate;border-spacing:2px;width:100%;table-layout:fixed;min-width:340px}
.wtab th{font-size:12px;color:var(--sub);font-weight:800;padding:2px 0}.wtab th.td{color:var(--acc)}.wtab th.nm{text-align:left;color:var(--ink);font-size:13px;width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtab td.c{height:38px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-size:11px;font-weight:800;text-align:center;overflow:hidden;white-space:nowrap;padding:0 1px}
.wtab td.off{background:#64748b;color:#fff}.wtab td.warn{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}
.day h2{display:flex;align-items:center;gap:8px}.day.today{border-color:var(--acc)}
.tg{display:inline-block;color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800;margin:4px 4px 0 0}
.wtab th.nm{white-space:normal;word-break:break-all;line-height:1.2;text-overflow:clip}.wtab td.g{height:30px}.wtab table.gt tr:first-child th:first-child{width:92px}.wtab td.g.on{color:#fff;cursor:pointer}.wtab td.gng{outline:2px solid var(--danger);outline-offset:-2px}
.gnm{all:unset;display:block;font-size:12px;font-weight:800;color:var(--ink);line-height:1.2;word-break:break-all;cursor:pointer;text-decoration:underline dotted}
.wtab td.c.multi{padding:1px;background:var(--card)}.wtab td.c.multi div{color:#fff;border-radius:4px;font-size:10px;line-height:17px;margin:1px 0}
.wtab table.kt{table-layout:auto}.wtab table.kt th.nm{width:auto;max-width:110px}.wtab td.k{text-align:center;font-weight:800;font-size:15px;background:var(--bg);border-radius:7px;padding:6px 2px}
.wtab .ot{font-size:9px;display:block;line-height:1}
.wtab td.dc{height:34px;font-size:13px;cursor:pointer}.wtab td.dc.we{color:#b91c1c}.wtab td.dc.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.role{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:#b45309;border-radius:6px;padding:1px 6px;vertical-align:2px}
.prow{display:flex;gap:6px;align-items:stretch}.prow .site{flex:1;min-width:0}.prow .mv{flex:none;width:64px;font-size:12px;line-height:1.3;margin:6px 0;height:auto}
.wtab .dots{display:flex;gap:2px;margin-top:2px}.wtab .dots i{width:7px;height:7px;border-radius:4px;display:block}.wtab tr.dim{opacity:.25}
label.ck{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;padding:6px 0}label.ck input{width:22px;height:22px;flex:none}
.age{height:44px;display:flex;align-items:center;font-size:18px;font-weight:800}
.lic{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:8px}.lic:first-child{border-top:0}
.sheet.big{background:rgba(0,0,0,.92);align-items:center;justify-content:center}.sheet.big img{max-width:100%;max-height:100%;object-fit:contain}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;display:flex;align-items:flex-end}.sbox{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow:auto}.sbox .btn{height:48px;font-size:15px}
</style>
</head>

</body>
</html>
