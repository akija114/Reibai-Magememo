<div id="v3c"></div><div id="v3h"></div><div id="v3l"></div><button class="big pri" id="v3go" data-v="go" disabled>🔧 この配管の曲げを作る</button></div>

<script>
/* 📐 図面（2026-11-14 ユーザー：図面は図面修正で読み込む。曲げ共有の図面は図面修正の3Dを開く所に・3Dをほかの人と共有して予習）
   ・図面修正（cad/）の端末の保存（IndexedDB zumen-sunpo の projects・__last＝いま開いている図面）を並べる
   ・3Dで開く：見えない cad/index.html?mk3d=番号 が3Dを作って pbmShare の "pipes" に入れる（z3Done）→ index.html?from=cadpipes（pipes.js）
     作った3Dは "z3c:番号" に残す（図面・図面修正の設定 zumen-* が同じなら作り直さない・3つまで）
   ・送る：3D（数の並びは2進のまま・gzip）を links/{番号} と links/{番号}x{i}（30万文字ずつ）に上げて zu3d.html?z3=番号 のリンク。開いた人はそれを受け取って曲げ共有へ（見るだけ・図面修正は要らない）
     現場カードに付ける（genba の sites の z3）と、現場のLINEの文章にリンクが入る */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT=0;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,Math.min(6000,1800+m.length*40))}
const busy=m=>{$("#busy").hidden=!m;if(m)$("#busyT").innerHTML=m};
const hm=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")};
const IDB=(nm,up)=>new Promise((ok,ng)=>{const o=indexedDB.open(nm,1);o.onupgradeneeded=()=>up(o.result);o.onsuccess=()=>ok(o.result);o.onerror=()=>ng(o.error)});
const zdb=()=>IDB("zumen-sunpo",d=>{if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"});if(!d.objectStoreNames.contains("projects"))d.createObjectStore("projects",{keyPath:"id"})}); // 図面修正と同じ作り
const sdb=()=>IDB("pbmShare",d=>{if(!d.objectStoreNames.contains("f"))d.createObjectStore("f")});
const gdb=()=>IDB("genba",d=>{if(!d.objectStoreNames.contains("sites"))d.createObjectStore("sites",{keyPath:"id"});if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos",{keyPath:"id"})});
async function op(dbf,st,mode,f){const d=await dbf();return new Promise((ok,ng)=>{const t=d.transaction(st,mode),r=f(t.objectStore(st));t.oncomplete=()=>{d.close();ok(r&&r.result)};t.onerror=t.onabort=()=>{d.close();ng(t.error)}})}
const sget=k=>op(sdb,"f","readonly",s=>s.get(k)),sput=(k,v)=>op(sdb,"f","readwrite",s=>s.put(v,k)),sdel=k=>op(sdb,"f","readwrite",s=>s.delete(k));
/* 図面修正の設定（機種・高さ・系統の名前など zumen-*）が変わったら作り直す */
function lsSig(){let h=2166136261;try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^zumen-/.test(k))ks.push(k)}ks.sort().forEach(k=>{const v=k+"="+localStorage.getItem(k);for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}})}catch(e){}return (h>>>0).toString(36)}
let PR=[];
async function render(){let all=[];try{all=(await op(zdb,"projects","readonly",s=>s.getAll()))||[]}catch(e){}
 const last=all.find(p=>p.id==="__last"),saved=all.filter(p=>p.id!=="__last").sort((a,b)=>b.updated-a.updated);PR=all;
 const row=(p,lb)=>`<div class="row"><b>${esc(p.name||p.srcName||"図面")}</b>${lb?` <span style="font-size:12px;font-weight:800;color:var(--acc)">${lb}</span>`:""}<div class="sub">${p.updated?hm(p.updated):""}${p.srcName&&p.srcName!==p.name?" ・ "+esc(p.srcName):""}</div><div class="bt"><button class="btn pri" data-o="${esc(p.id)}">🧊 3Dで開く</button><button class="btn" data-s="${esc(p.id)}">📤 送る</button></div></div>`;
 $("#list").innerHTML=(last&&last.fileId?row(last,"図面修正でいま開いている"):"")+saved.map(p=>row(p)).join("")||`<div class="empty">まだありません。上の「✏️ 図面修正で図面を読み込む・直す」で図面を開いてください。</div>`}
/* 見えない図面修正で3Dを作る */
let FR=null;
async function build(id){const p=PR.find(x=>x.id===id);if(!p)throw new Error("図面が見つかりません");const sig=(p.updated||0)+"|"+lsSig()+"|9",ck="z3c:"+id;   // |2：室内機の向き・模型を直した版（前に作った3Dは作り直す）
 try{const c=await sget(ck);if(c&&c.sig===sig&&c.rec)return c.rec}catch(e){}
 busy(`🧊 「${esc(p.name||"図面")}」の3Dを作っています…<br><span style="font-size:13px;font-weight:500">大きい図面は1分くらいかかります。画面を閉じずにお待ちください</span>`);
 try{const r=await new Promise(ok=>{window.z3Done=ok;if(FR)FR.remove();FR=document.createElement("iframe");FR.setAttribute("aria-hidden","true");FR.tabIndex=-1;FR.style.cssText="position:fixed;left:-10000px;top:0;width:390px;height:700px;border:0;visibility:hidden";FR.src="cad/index.html?mk3d="+encodeURIComponent(id)+"&t="+Date.now();document.body.appendChild(FR);setTimeout(()=>ok({err:"時間切れ"}),240000)});
  window.z3Done=null;if(FR){FR.src="about:blank";FR.remove();FR=null}
  if(!r||r.err)throw new Error((r&&r.err)||"作れませんでした");
  const rec=await sget("pipes");if(!rec||!rec.sc)throw new Error("3Dを受け取れませんでした");
  try{await sput(ck,{sig,rec,t:Date.now()});const ks=(await op(sdb,"f","readonly",s=>s.getAllKeys())).filter(k=>/^z3c:/.test(k)&&k!==ck);if(ks.length>2){const ts=[];for(const k of ks){const v=await sget(k);ts.push([k,v&&v.t||0])}ts.sort((a,b)=>a[1]-b[1]).slice(0,ks.length-2).forEach(([k])=>sdel(k))}}catch(e){}
  return rec}finally{busy("")}}
/* 3Dはこの画面で見る（2026-11-16 ユーザー：図面は図面の画面で開く・選んだ配管だけ曲げ共有へ）。作った3Dは pbmShare の "z3v" にも残す（曲げ共有の「📐 図面で選び直す」→ ?v=1） */
async function openRec(rec){try{await sput("z3v",rec)}catch(e){}await showV(rec)}
const load3=()=>window.THREE?Promise.resolve():new Promise((ok,ng)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";sc.onload=ok;sc.onerror=()=>ng(new Error("3Dの部品を読めません。電波を確かめてください"));document.head.appendChild(sc)});
const V={};
function vClose(){$("#v3").hidden=true;document.body.style.overflow="";if(V.raf)cancelAnimationFrame(V.raf);V.raf=0;if(V.ren){V.ren.dispose();V.ren.domElement.remove();V.ren=null}V.rec=null}
async function showV(rec){busy("🧊 3Dを出しています…");try{await load3()}finally{busy("")}
 const T=THREE;vClose();V.rec=rec;V.cur=-1;$("#v3").hidden=false;document.body.style.overflow="hidden";$("#v3n").textContent="🧊 "+(rec.name||"図面");
 const box=$("#v3c"),ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(2,devicePixelRatio||1));box.appendChild(ren.domElement);V.ren=ren;
 const sc=new T.Scene();sc.background=new T.Color(0xdfe7ef);sc.add(new T.HemisphereLight(0xffffff,0x8899aa,.85));const dl=new T.DirectionalLight(0xffffff,.55);dl.position.set(1,2,1.5);sc.add(dl);V.sc=sc;
 const cx=rec.cx||0,cy=rec.cy||0;let root=null;
 if(rec.sc){try{root=new T.ObjectLoader().parse(rec.sc);sc.add(root)}catch(e){console.warn(e)}}
 V.pt=rec.pipes.map(p=>p.P.map(q=>new T.Vector3(q[0]-cx,q[2],-(q[1]-cy))));
 if(!root){const m=new T.MeshStandardMaterial({color:0x94a3b8});V.pt.forEach(P=>{for(let i=1;i<P.length;i++)sc.add(tube(P[i-1],P[i],15,m))})} // 3Dの形が無い時は配管を灰色で
 /* 配管の管（系統 sy・引いた配管 np）→ 番号 */
 V.hit=[];sc.traverse(n=>{let o=n,j=-1;while(o&&j<0){const d=o.userData||{};if(d.sy!=null||d.np!=null)j=rec.pipes.findIndex(p=>(d.sy!=null&&p.sy===d.sy)||(d.np!=null&&p.np===d.np));o=o.parent}if(n.isMesh&&j>=0){n.userData.j=j;V.hit.push(n)}});
 V.sel=new T.Group();sc.add(V.sel);
 const bb=new T.Box3();if(root)bb.setFromObject(root);V.pt.forEach(P=>P.forEach(v=>bb.expandByPoint(v)));if(bb.isEmpty())bb.set(new T.Vector3(-3000,0,-3000),new T.Vector3(3000,3000,3000));
 V.c=bb.getCenter(new T.Vector3());V.d=Math.max(3000,bb.getSize(new T.Vector3()).length()*.75);V.th=-.6;V.ph=.9;
 V.cam=new T.PerspectiveCamera(45,1,20,V.d*20);
 $("#v3h").textContent=rec.pipes.length?"見たい配管を3Dでタップするか、下から選んでください（1本指で回す・2本指で大きく・ずらす）":"この図面には曲げを出せる配管がありません（3Dを見るだけ）";
 $("#v3l").innerHTML=rec.pipes.map((p,j)=>`<button data-j="${j}">${esc(p.nm)}・${(V.pt[j].reduce((a,v,i)=>i?a+v.distanceTo(V.pt[j][i-1]):0,0)/1000).toFixed(1)}m</button>`).join("");
 $("#v3go").hidden=!rec.pipes.length;vPick(rec.pipes.length&&rec.cur!=null&&rec.cur>=0&&rec.cur<rec.pipes.length&&rec.only?rec.cur:-1);
 const loop=()=>{V.raf=requestAnimationFrame(loop);const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;if(ren.domElement.width!==Math.round(w*ren.getPixelRatio())||ren.domElement.height!==Math.round(h*ren.getPixelRatio())){ren.setSize(w,h,false);V.cam.aspect=w/h;V.cam.updateProjectionMatrix()}
  V.cam.position.set(V.c.x+V.d*Math.sin(V.ph)*Math.sin(V.th),V.c.y+V.d*Math.cos(V.ph),V.c.z+V.d*Math.sin(V.ph)*Math.cos(V.th));V.cam.lookAt(V.c);if(V.selM&&V.cur>=0)V.selM.opacity=.55+.45*Math.abs(Math.sin(Date.now()/350));ren.render(sc,V.cam)};loop()}
function tube(a,b,r,m){const T=THREE,L=a.distanceTo(b),g=new T.Group();if(L>1){const c=new T.Mesh(new T.CylinderGeometry(r,r,L,12),m);c.position.copy(a).add(b).multiplyScalar(.5);c.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),b.clone().sub(a).normalize());g.add(c)}const k=new T.Mesh(new T.SphereGeometry(r,12,8),m);k.position.copy(b);g.add(k);return g}
/* 配管を選ぶ：黄色の太い管で重ねて、そこへ寄る */
function vPick(j){const T=THREE;V.cur=j;while(V.sel.children.length)V.sel.remove(V.sel.children[0]);
 document.querySelectorAll("#v3l button").forEach(b=>b.classList.toggle("on",+b.dataset.j===j));$("#v3go").disabled=j<0;
 if(j<0)return;const P=V.pt[j],bb=new T.Box3();P.forEach(v=>bb.expandByPoint(v));V.c=bb.getCenter(new T.Vector3());V.d=Math.max(2500,bb.getSize(new T.Vector3()).length()*.62/(.414*Math.min(1,V.cam?V.cam.aspect:.8)));
 /* 太さは見る距離に合わせる・黒いふち＋点滅（2026-11-16：黄色・だいだいの系統にまぎれて見えない） */
 const r=Math.max(45,V.d/110),k=new T.MeshBasicMaterial({color:0x111827,transparent:true,opacity:.6,depthTest:false});V.selM=new T.MeshBasicMaterial({color:0xfacc15,transparent:true,opacity:1,depthTest:false});
 P.forEach((v,i)=>{if(i){const a=tube(P[i-1],v,r*1.6,k),b=tube(P[i-1],v,r,V.selM);a.traverse(o=>{o.renderOrder=8});b.traverse(o=>{o.renderOrder=9});V.sel.add(a,b)}});
 const b=document.querySelector(`#v3l button[data-j="${j}"]`);if(b)b.scrollIntoView({block:"nearest",inline:"center"})}
/* さわる：1本指で回す・2本指で大きく／ずらす・軽くタップで配管を選ぶ */
(()=>{const box=$("#v3c"),P=new Map();let g=null;
 const two=()=>{const [a,b]=[...P.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
 box.addEventListener("pointerdown",e=>{box.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});g=P.size===1?{t:Date.now(),x:e.clientX,y:e.clientY,mv:0}:{...two(),mv:1}});
 box.addEventListener("pointermove",e=>{const o=P.get(e.pointerId);if(!o||!V.cam)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
  if(P.size===1){if(Math.hypot(e.clientX-g.x,e.clientY-g.y)>6)g.mv=1;V.th-=dx*.008;V.ph=Math.max(.05,Math.min(Math.PI/2-.02,V.ph-dy*.008))}
  else if(P.size===2){const n=two();if(g.d)V.d=Math.max(300,Math.min(V.cam.far/3,V.d*g.d/Math.max(1,n.d)));const k=V.d/box.clientHeight*.9,T=THREE,r=new T.Vector3(Math.cos(V.th),0,-Math.sin(V.th)),f=new T.Vector3(Math.sin(V.th),0,Math.cos(V.th));V.c.addScaledVector(r,-(n.x-g.x)*k).addScaledVector(f,-(n.y-g.y)*k);g={...n,mv:1}}});
 box.addEventListener("wheel",e=>{e.preventDefault();V.d=Math.max(300,V.d*(e.deltaY>0?1.12:.89))},{passive:false});
