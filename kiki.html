<!DOCTYPE html>
<html lang="ja" data-app="kiki">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機器 - 冷媒配管の曲げ共有</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0369a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="曲げ共有 v1.00">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#0f172a;--sub:#5b6b7e;--line:#c9d5e0;--acc:#0369a1;--gas:#2563eb;--liq:#dc2626;--dr:#16a34a;--bolt:#7c3aed;--body:#94a3b8;--panel:#e2e8f0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#16222f;--ink:#e8eef5;--sub:#93a5b8;--line:#2b3b4c;--acc:#38bdf8;--gas:#60a5fa;--liq:#f87171;--dr:#4ade80;--bolt:#a78bfa;--body:#64748b;--panel:#1e2b3a}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#16222f;--ink:#e8eef5;--sub:#93a5b8;--line:#2b3b4c;--acc:#38bdf8;--gas:#60a5fa;--liq:#f87171;--dr:#4ade80;--bolt:#a78bfa;--body:#64748b;--panel:#1e2b3a}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
.apps{display:flex;gap:4px;margin:0 0 10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.apps a{flex:1;text-align:center;padding:7px 0;border-radius:9px;font-size:13px;font-weight:800;color:var(--sub);text-decoration:none;white-space:nowrap}
.apps a.on{background:var(--acc);color:#fff}
select{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:700;padding:0 10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
h2{font-size:15px;margin:0 0 8px}
.nm{font-size:19px;font-weight:800}.sub{color:var(--sub);font-size:13px;margin-top:2px}
svg{width:100%;height:auto;display:block}
.tb{width:100%;border-collapse:collapse;font-size:15px}
.tb td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.tb td:first-child{font-weight:800;white-space:nowrap;width:1%}
.tb b{font-size:20px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:4px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--sub);line-height:1.55;margin-top:8px}
.vw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.vw button{flex:1;min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;font-weight:800}#m3t{display:grid;grid-template-columns:1fr 1fr}#m3t label{justify-content:flex-start;padding:0 10px;white-space:nowrap}.vw label{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-height:40px;border-radius:10px;border:1.5px solid var(--line);font-size:13.5px;font-weight:800}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:13.5px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
a.doc{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<nav class="apps"><a href="home.html" style="flex:0 0 38px" aria-label="入口">🏠</a><a href="index.html">🔧 曲げ共有</a><a href="zumen.html">📐 図面</a><a href="genchou.html">📹 現調</a><a href="kiki.html" class="on">🔩 機器</a><a href="genba.html">📋 現場</a></nav>
<div style="display:flex;gap:6px;margin:0 0 8px"><input id="q" placeholder="品番を入れる（例 PL-ZRP80HA5）" autocomplete="off" autocapitalize="characters" style="flex:1;min-width:0;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 10px"><button id="qb" style="height:44px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:800;padding:0 14px">さがす</button></div>
<div id="qr"></div>
<select id="m" aria-label="機種"></select>
<div id="out"></div>
<script src="models.js?v=305"></script>
<script src="kiso.js?v=17"></script>
<script>
/* 🔩 機器：仕込み用の寸法を見るページ（模型は three.js をこのページだけで読む・core.js は読まない）
   配管口・ドレンの位置は「全ねじ（吊りボルト）の芯」から測る。開口寸法は現場で変わるので、全ねじ基準なら誰でも使える */
const $=s=>document.querySelector(s),f=n=>Math.round(n).toLocaleString("ja-JP");
const sel=$("#m");
CAS2_MAKERS.forEach(([mk,mn])=>{const g=document.createElement("optgroup");g.label=mn;
 CAS2_ORDER.filter(k=>CAS2M[k]&&CAS2M[k].mk===mk).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=CAS2M[k].n+"（"+CAS2M[k].kind+"）";g.appendChild(o)});sel.appendChild(g)});
{const g=document.createElement("optgroup");g.label="換気（ロスナイ・三菱電機）";VENT_ORDER.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=VENTM[x].n+"（ロスナイ）";g.appendChild(o)});sel.appendChild(g)}
const OK=k=>!!(CAS2M[k]||VENTM[k]);
let cur=new URLSearchParams(location.search).get("m");
if(!OK(cur)){try{cur=localStorage.getItem("pbm_kiki")}catch(e){}}
if(!OK(cur)){try{const j=JSON.parse(localStorage.getItem("pbm1"));cur=j&&j.units&&j.units.ms}catch(e){}}
if(!OK(cur))cur=CAS2_ORDER[0];
sel.value=cur;sel.onchange=()=>{cur=sel.value;try{localStorage.setItem("pbm_kiki",cur)}catch(e){}draw()};
/* 品番でさがす：ハイフン・空白・全角・大文字小文字はちがっても同じ。品番の一部でも出す。無い時は「調べてほしい品番」に残す */
const QN=s=>String(s||"").normalize("NFKC").toUpperCase().replace(/[\s\-－‐ー_/・.]/g,"");
const ALLM=()=>Object.keys(CAS2M).map(k=>[k,CAS2M[k].n,CAS2M[k].kind]).concat(VENT_ORDER.map(k=>[k,VENTM[k].n,"ロスナイ"]));
function qFind(t){const q=QN(t);if(!q)return[];const L=ALLM(),ex=L.filter(([,n])=>QN(n)===q);if(ex.length)return ex;
 return L.filter(([,n])=>{const m=QN(n);return m.includes(q)||q.includes(m)||(q.length>=6&&m.startsWith(q.slice(0,Math.max(6,q.length-3))))})}
function qReq(){try{return JSON.parse(localStorage.getItem("pbm_kiki_req")||"[]")}catch(e){return[]}}
function qGo(){const t=$("#q").value.trim(),r=$("#qr");if(!t){r.innerHTML="";return}const hit=qFind(t);
 if(hit.length===1){cur=hit[0][0];sel.value=cur;try{localStorage.setItem("pbm_kiki",cur)}catch(e){}r.innerHTML=`<div class="note" style="margin:0 2px 8px">✅ ${hit[0][1]}（${hit[0][2]}）を出しました</div>`;draw();return}
 if(hit.length>1){r.innerHTML=`<div class="card" style="margin-top:0"><div class="sub">近い品番が ${hit.length} 個あります。押して選んでください</div>${hit.map(([k,n,kd])=>`<button data-k="${k}" style="display:block;width:100%;text-align:left;margin-top:6px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;padding:0 10px">${n}（${kd}）</button>`).join("")}</div>`;
  r.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{cur=b.dataset.k;sel.value=cur;try{localStorage.setItem("pbm_kiki",cur)}catch(e){}r.innerHTML="";draw()});return}
 const req=qReq();if(!req.some(x=>QN(x)===QN(t))){req.push(t.normalize("NFKC").toUpperCase());try{localStorage.setItem("pbm_kiki_req",JSON.stringify(req.slice(-50)))}catch(e){}}
 r.innerHTML=`<div class="card" style="margin-top:0;border-color:#f59e0b"><b>「${t.replace(/[<>&"]/g,"")}」はまだアプリに入っていない品番です</b><div class="note">「調べてほしい品番」に残しました。この品番をチャットで教えてもらえれば、メーカーの外形図から寸法（本体・吊りボルト・配管とドレンの位置）を調べてアプリに登録します。<br>調べてほしい品番：${qReq().join("、").replace(/[<>&"]/g,"")}</div></div>`}
$("#qb").onclick=qGo;$("#q").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();qGo()}};
{const q0=new URLSearchParams(location.search).get("q");if(q0){$("#q").value=q0;setTimeout(qGo,0)}}
let face="L";   // 配管の出る面を正面に見て（左右の言い方）

/* 配管口・ドレンの位置を、いちばん近い全ねじの芯から */
function fromBolt(m,p){
 const xP=m.L/2-(m.pin||0),dx=xP-m.ba/2;               // 配管が出る面の方向（手前）
 const side=p.z>=0?"左":"右",dz=Math.abs(p.z)-m.bb/2;   // 左右（配管の出る面を正面に見て。z＋が左）
 return{dx,dz,side}}
const io=(v,o,i)=>v>=0?o+" "+f(v):i+" "+f(-v);

/* ロスナイ：上から見た図（ダクトの差し込み口・天吊金具）と寸法 */
function drawVent(){const V=VENTM[cur],W=360,span=Math.max(V.A+2*V.J+260,V.E+200),S=320/span,H=Math.round((V.E+220)*S)+40,cx=W/2,cy=(H-20)/2;
 const X=x=>cx+x*S,Y=y=>cy+y*S;let sv=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="上から見た図">`;
 sv+=`<rect x="${X(-V.A/2)}" y="${Y(-V.B/2)}" width="${V.A*S}" height="${V.B*S}" fill="none" stroke="var(--body)" stroke-width="2"/>`;
 [-1,1].forEach(a=>[-1,1].forEach(b=>{sv+=`<circle cx="${X(a*V.D/2)}" cy="${Y(b*V.E/2)}" r="6" fill="var(--bolt)"/>`}));
 const dy=[-V.B/2+V.L,-V.B/2+V.L+V.K],D=[["EA 排気",-1,0,"#dc2626"],["OA 外気",-1,1,"#16a34a"],["RA 還気",1,0,"#ea580c"],["SA 給気",1,1,"#2563eb"]];
 D.forEach(([n,sx,j,c])=>{const x0=X(sx*V.A/2),x1=X(sx*(V.A/2+V.J));sv+=`<rect x="${Math.min(x0,x1)}" y="${Y(dy[j]-V.d/2)}" width="${Math.abs(x1-x0)}" height="${V.d*S}" fill="${c}33" stroke="${c}" stroke-width="1.5"/><text x="${x1+sx*4}" y="${Y(dy[j])+4}" text-anchor="${sx<0?"end":"start"}" font-size="12" font-weight="800" fill="${c}">${n}</text>`});
 sv+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--sub)">▼ 点検口・メンテナンス側（手前）</text></svg>`;
 const row=(l,h)=>`<tr><td>${l}</td><td>${h}</td></tr>`;
 let tb=row("本体",`<b>${f(V.A)}</b> × <b>${f(V.B)}</b> × 高さ <b>${f(V.C)}</b>（${V.kg}kg）`)+row(`<span class="dot" style="background:var(--bolt)"></span>吊りピッチ`,`<b>${f(V.D)}</b> × <b>${f(V.E)}</b>（金具の出 ${f(V.F)}）`)+
  row("ダクト",`呼び径 <b>φ${V.d}</b>（フランジ外径 ${V.G}・${V.H}、出 ${V.J}）`)+row("ダクトの位置",`ダクトピッチ <b>${f(V.K)}</b><br>奥の端から最初のダクト芯 <b>${f(V.L)}</b><br>下面からダクト芯 <b>${f(V.P)}</b>`)+
  row("点検口",`□450 または □600（メンテナンス側の下）<br>本体から 150〜250、天井から600以上のスペース`);
 $("#out").innerHTML=`<div class="card"><div class="nm">${V.n}</div><div class="sub">三菱電機　ロスナイ（天井埋込形）</div></div><div class="card"><h2>📏 寸法</h2><table class="tb">${tb}</table></div><div class="card"><h2>上から見た図</h2>${sv}<div class="note">紫＝天吊金具（全ねじ）。数値はメーカーの外形寸法表より。</div></div>`}
function draw(){if(VENTM[cur]){drawVent();return}const m=CAS2M[cur],bi=!!m.bi,fin=bi?"本体の下面":"天井の仕上げ面";
 const P=[["gas","ガス",m.g?"φ"+m.g:"","--gas"],["liq","液",m.l?"φ"+m.l:"","--liq"],["dr","ドレン",m.dn?"":"","--dr"]].filter(a=>m[a[0]]);
 /* ---- 上から見た図（配管の出る面が手前＝下）。svgの横＝左右（左が−z… 正面に見て左＝図の左）、縦＝配管の方向（下が手前） ---- */
 const span=Math.max(m.pa||m.L,m.ba,m.L)+260,spanY=Math.max(m.pb||m.W,m.bb,m.W)+260,S=340/Math.max(span,spanY),W=360,H=Math.round(spanY*S)+44;
 const cx=W/2,cy=(H-22)/2,X=z=>cx-z*S,Y=x=>cy+x*S;   // 正面に見て左（z＋）→ 図の左
 const rect=(a,b,cls,st)=>`<rect x="${cx-b/2*S}" y="${cy-a/2*S}" width="${b*S}" height="${a*S}" ${st}/>`;
 let sv=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="上から見た図">`;
 if(!bi&&m.pa)sv+=rect(m.pa,m.pb,"",`fill="var(--panel)" stroke="var(--line)" stroke-dasharray="4 3"`);
 sv+=rect(m.L,m.W,"",`fill="none" stroke="var(--body)" stroke-width="2"`);
 if(!bi&&m.oa)sv+=rect(m.oa,m.ob,"",`fill="none" stroke="var(--sub)" stroke-width="1" stroke-dasharray="1 3"`);
 /* 全ねじ */
 [-1,1].forEach(a=>[-1,1].forEach(b=>{sv+=`<circle cx="${X(b*m.bb/2)}" cy="${Y(a*m.ba/2)}" r="6" fill="var(--bolt)"/>`}));
 sv+=`<line x1="${X(m.bb/2)}" y1="${Y(-m.ba/2)-18}" x2="${X(-m.bb/2)}" y2="${Y(-m.ba/2)-18}" stroke="var(--bolt)" stroke-width="1.5"/><text x="${cx}" y="${Y(-m.ba/2)-23}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--bolt)">${f(m.bb)}</text>`;
 sv+=`<line x1="${X(m.bb/2)-18}" y1="${Y(-m.ba/2)}" x2="${X(m.bb/2)-18}" y2="${Y(m.ba/2)}" stroke="var(--bolt)" stroke-width="1.5"/><text x="${X(m.bb/2)-23}" y="${cy}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--bolt)" transform="rotate(-90 ${X(m.bb/2)-23} ${cy})">${f(m.ba)}</text>`;
 /* 配管口 */
 const xP=m.L/2-(m.pin||0);
 P.forEach(([k,n,,c],i)=>{const p=m[k],px=X(p.z),py=Y(xP);sv+=`<circle cx="${px}" cy="${py}" r="7" fill="var(${c})" stroke="#fff" stroke-width="1.5"/><text x="${px}" y="${py+24+(i%2)*13}" text-anchor="middle" font-size="12" font-weight="800" fill="var(${c})">${n}</text>`});
 sv+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--sub)">▲ 配管の出る面（手前）</text></svg>`;
 /* ---- 横から見た図（配管の出る面を正面に見て）。縦＝高さ（仕上げ面＝0）---- */
 const top=m.top||m.H,yMax=Math.max(top,m.nk||0)+90,yMin=bi?-40:-(m.pt||0)-60,SH=Math.min(S,170/(yMax-yMin)),H2=Math.round((yMax-yMin)*SH)+30,Z=y=>15+(yMax-y)*SH;
 let s2=`<svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="横から見た図">`;
 s2+=`<line x1="4" y1="${Z(0)}" x2="${W-4}" y2="${Z(0)}" stroke="var(--sub)" stroke-width="2"/><text x="6" y="${Z(0)-4}" font-size="11.5" font-weight="700" fill="var(--sub)">${bi?"本体下面":"天井仕上げ 0"}</text>`;
 if(!bi&&m.pt)s2+=`<rect x="${cx-(m.pb||m.W)/2*S}" y="${Z(0)}" width="${(m.pb||m.W)*S}" height="${Math.max(3,m.pt*SH)}" fill="var(--panel)" stroke="var(--line)"/>`;
 s2+=`<rect x="${cx-m.W/2*S}" y="${Z(top)}" width="${m.W*S}" height="${(top-(bi?0:top-m.H))*SH}" fill="none" stroke="var(--body)" stroke-width="2"/>`;
 [-1,1].forEach(b=>{const x=X(b*m.bb/2);s2+=`<line x1="${x}" y1="${Z(yMax)}" x2="${x}" y2="${Z(m.nk)}" stroke="var(--bolt)" stroke-width="3"/><rect x="${x-9}" y="${Z(m.nk)-4}" width="18" height="8" fill="var(--bolt)"/>`});
 s2+=`<text x="${X(-m.bb/2)-14}" y="${Z(m.nk)-8}" text-anchor="end" font-size="12" font-weight="800" fill="var(--bolt)">ネコ ${f(m.nk)}</text>`;
 P.forEach(([k,n,,c])=>{const p=m[k];s2+=`<circle cx="${X(p.z)}" cy="${Z(p.y)}" r="6" fill="var(${c})" stroke="#fff" stroke-width="1.5"/><text x="${X(p.z)}" y="${Z(p.y)-9}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(${c})">${f(p.y)}</text>`});
 s2+=`</svg>`;
 /* ---- 数字の表（仕込みで使う所） ---- */
 const row=(lab,html)=>`<tr><td>${lab}</td><td>${html}</td></tr>`;
 let tb=row(`<span class="dot" style="background:var(--bolt)"></span>吊りピッチ`,`<b>${f(m.ba)}</b> × <b>${f(m.bb)}</b><div class="note" style="margin:2px 0 0">${f(m.ba)}＝配管の出る方向／${f(m.bb)}＝その横</div>`);
 tb+=row("ネコの高さ",`${fin}から <b>${f(m.nk)}</b>`);
 P.forEach(([k,n,d,c])=>{const p=m[k],r=fromBolt(m,p);
  tb+=row(`<span class="dot" style="background:var(${c})"></span>${n}${d?`<br><small>${d}</small>`:""}`,
   `手前の全ねじ芯から <b>${io(r.dx,"外へ","内へ")}</b><br>${r.side}の全ねじ芯から <b>${io(r.dz,"外へ","内へ")}</b><br>${fin}から 上へ <b>${f(p.y)}</b>`)});
 tb+=row("ドレンアップ",m.du?`${fin}から <b>${f(m.du)}</b> まで`:(m.kind==="4方向"?`目安 ${fin}から <b>850</b> まで（機種の資料で確認）`:"資料で確認"));
 tb+=row("天井内",`${fin}から本体の天面まで <b>${f(top)}</b>`);
 if(!bi)tb+=row("開口",`<b>${m.oTxt||f(m.oa)+" × "+f(m.ob)}</b>${m.oTxt?`（図面 ${f(m.oa)}×${f(m.ob)}）`:""}<br>パネル ${f(m.pa)} × ${f(m.pb)}`);
 tb+=row("本体",`${f(m.L)} × ${f(m.W)} × 高さ ${f(m.H)}`);
 $("#out").innerHTML=`<div class="card"><div class="nm">${m.n}</div><div class="sub">${(CAS2_MAKERS.find(x=>x[0]===m.mk)||["",""])[1]}　${m.kind}${m.sub?"・"+m.sub:""}</div></div>
<div class="card"><h2>🧊 模型と寸法</h2><div id="m3" style="position:relative;width:100%;height:380px;border-radius:12px;overflow:hidden;background:#f8fafc;touch-action:none"><div id="m3w" class="note" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0">模型を読み込んでいます…</div></div>
<div class="vw" id="m3v">${[["iso","斜め"],["top","上から"],["front","配管の面"],["side","横"],["bot","下から"]].map(([k,t])=>`<button data-v="${k}">${t}</button>`).join("")}</div>
<div class="vw" id="m3t">${[["m3db","本体の寸法"],["m3dt","吊り・ネコ"],["m3dp","配管の口"],["m3dn","パネル・開口"],["m3u","本体"],["m3n","パネル"],["m3b","全ねじ"],["m3c","天井"]].map(([k,t])=>`<label><input type="checkbox" id="${k}" ${m3Vis(k)?"checked":""}> ${t}</label>`).join("")}</div><div class="vw"><button id="m3all">寸法を全部出す</button><button id="m3none">寸法を全部消す</button></div>
<div class="note">1本指で回す・2本指で広げて大きく。紫＝全ねじ・ネコ／青＝ガス／赤＝液／緑＝ドレン／灰色の板＝${bi?"本体の下面":"天井の仕上げ面"}。数字は mm。</div></div>
<div class="card"><h2>📏 仕込み寸法（全ねじの芯から）</h2><table class="tb">${tb}</table>

 {const k=bx(m.L,m.H,m.W,0,yb+m.H/2,0,C.body);k.material.transparent=true;k.material.opacity=.5;k.material.depthWrite=false;const e=new TH.LineSegments(new TH.EdgesGeometry(k.geometry),new TH.LineBasicMaterial({color:0x334155}));e.position.copy(k.position);G.body.add(e)}   // 本体は透かして中の配管の口が見えるように

 const lab=(txt,p,col)=>{const cv=document.createElement("canvas"),x=cv.getContext("2d"),fs=44;x.font=`800 ${fs}px -apple-system,'Hiragino Sans',sans-serif`;const w=Math.ceil(x.measureText(txt).width)+24;cv.width=w;cv.height=fs+20;
   x.font=`800 ${fs}px -apple-system,'Hiragino Sans',sans-serif`;x.fillStyle=dark?"rgba(15,23,42,.85)":"rgba(255,255,255,.9)";x.fillRect(0,0,w,fs+20);x.fillStyle="#"+col.toString(16).padStart(6,"0");x.textBaseline="middle";x.fillText(txt,12,(fs+20)/2+2);
   const sp=new TH.Sprite(new TH.SpriteMaterial({map:new TH.CanvasTexture(cv),depthTest:false}));const h=span*0.038;sp.scale.set(h*w/(fs+20),h,1);sp.position.copy(p);sp.renderOrder=9;(cg||G.dim).add(sp)};
 const ln=(a,b,col)=>{const l=new TH.Line(new TH.BufferGeometry().setFromPoints([a,b]),new TH.LineBasicMaterial({color:col,depthTest:false}));l.renderOrder=8;(cg||G.dim).add(l)};
 const dim=(a,b,off,txt,col)=>{col=col||C.dim;const A=a.clone().add(off),B=b.clone().add(off);ln(A,B,col);ln(a,A,col);ln(b,B,col);const n=off.clone().normalize().multiplyScalar(span*0.03);lab(txt,A.clone().add(B).multiplyScalar(.5).add(n),col)};
 const o=span*0.07;let cg=G.db;   // 寸法は種類ごとのグループに（出す／消す）
