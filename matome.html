 const search=async()=>{const v=q.value.trim();if(!v)return;q.blur();try{const j=await (await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(v))).json();if(!j||!j.length){toast("見つかりませんでした。市の名前からさがしてみてください");return}const c=j[0].geometry.coordinates;gGo(c[1],c[0],17);toast(j[0].properties&&j[0].properties.title||"見つかりました")}catch(e){toast("さがせませんでした（電波を確かめてください）")}};
 $("#gS").onclick=search;q.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();search()}};if(q.value&&!last)search();
 $("#gHere").onclick=()=>{if(!navigator.geolocation){toast("今いる所が分かりません");return}toast("今いる所をさがしています…");navigator.geolocation.getCurrentPosition(p=>gGo(p.coords.latitude,p.coords.longitude,18),()=>toast("今いる所が分かりませんでした（位置情報を許可してください）"),{enableHighAccuracy:true,timeout:15000})};
 $("#gT").onclick=e=>{GM.t=GM.t==="photo"?"std":"photo";e.target.textContent=GT[GM.t==="photo"?"std":"photo"][0]+"にする";gDraw()};
 $("#gM").onclick=()=>gZoom(-1);$("#gP").onclick=()=>gZoom(1);$("#gBack").onclick=()=>{location.hash="r="+R.id};
 gcv.onwheel=e=>{e.preventDefault();const r2=gcv.getBoundingClientRect();gZoom(e.deltaY<0?1:-1,e.clientX-r2.left,e.clientY-r2.top)};
 const P=e=>{const r2=gcv.getBoundingClientRect();return[e.clientX-r2.left,e.clientY-r2.top]};
 gcv.onpointerdown=e=>{gcv.setPointerCapture(e.pointerId);gptr.set(e.pointerId,P(e));if(gptr.size===1)gG={t:"pan",p:P(e),x:GM.x,y:GM.y};else{const [a,b]=[...gptr.values()];gG={t:"pin",d0:Math.hypot(a[0]-b[0],a[1]-b[1])||1,s:1}}};
 gcv.onpointermove=e=>{if(!gptr.has(e.pointerId)||!gG)return;gptr.set(e.pointerId,P(e));if(gG.t==="pan"){const p=P(e);GM.x=gG.x-(p[0]-gG.p[0]);GM.y=gG.y-(p[1]-gG.p[1]);gDraw()}else if(gptr.size>=2){const [a,b]=[...gptr.values()];gG.s=Math.hypot(a[0]-b[0],a[1]-b[1])/gG.d0;gDraw(gG.s)}};
 const up=e=>{if(!gptr.has(e.pointerId))return;gptr.delete(e.pointerId);if(gG&&gG.t==="pin"&&!gptr.size){const dz=Math.round(Math.log2(gG.s));gG=null;if(dz)gZoom(dz);else gDraw()}else if(!gptr.size)gG=null};gcv.onpointerup=up;gcv.onpointercancel=up;
 $("#gOk").onclick=geoMake;
}
/* 見えている範囲を絵にして、写真の1枚目（地図）にする。2倍の大きさで作る */
async function geoMake(){const d=devicePixelRatio||1,W=Math.round(gcv.width/d),H=Math.round(gcv.height/d),K=2,z=GM.z+1,c=document.createElement("canvas");c.width=W*K;c.height=H*K;const g=c.getContext("2d");
 toast("地図を作っています…");const ims=[];drawTiles(g,GM.t,z,GM.x*2,GM.y*2,W*K,H*K,1,ims);
 await new Promise(ok=>{const t0=Date.now(),chk=()=>{if(ims.every(a=>!a[2]||a[2].ok||a[2].bad)||Date.now()-t0>12000)ok();else setTimeout(chk,150)};chk()});
 g.fillStyle="#cbd5e1";g.fillRect(0,0,c.width,c.height);g.imageSmoothingQuality="high";ims.forEach(([,,im,x,y,T])=>{if(im&&im.ok)g.drawImage(im,x,y,T+.6,T+.6)});
 g.fillStyle="#ffffffcc";g.fillRect(c.width-200,c.height-34,200,34);g.fillStyle="#0f172a";g.font="bold 20px sans-serif";g.fillText("出典：国土地理院",c.width-190,c.height-10);
 const lat=yLat(GM.y,GM.z),mpp=156543.03392*Math.cos(lat*Math.PI/180)/2**z*1000;   // 1ピクセルが何mmか
 let b;try{b=await new Promise((ok,ng)=>{try{c.toBlob(x=>x?ok(x):ng(new Error("x")),"image/jpeg",.88)}catch(e){ng(e)}})}catch(e){toast("地図を写せませんでした。地図のアプリの画面写真を「図面・写真を選ぶ」で入れてください");return}
 const n=R.pages.filter(p=>p.geo).length,p={id:rid("p"),name:n?"現場の近く（拡大）":"駐車の場所と現場（地図）",img:b,w:c.width,h:c.height,items:[],mats:{},mpp,geo:1};
 R.pages.splice(n,0,p);await putRep(R);toast("地図を入れました。🅿・現場の印や機器の模型を置けます");location.hash="e="+R.id+":"+p.id}

/* ===== 画面の切りかえ ===== */
async function route(){const h=location.hash.slice(1);E=null;if(R){clearTimeout(saveT);await putRep(R).catch(()=>{})}
 if(h.startsWith("e=")){const [a,b]=h.slice(2).split(":");renderEdit(a,b);return}
 if(h.startsWith("g=")){renderGeo(h.slice(2));return}
 if(h.startsWith("r=")){renderRep(h.slice(2));return}R=null;renderList()}
addEventListener("hashchange",route);
addEventListener("pagehide",()=>{if(R){clearTimeout(saveT);putRep(R)}});
route();
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
